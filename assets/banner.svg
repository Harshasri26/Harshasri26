    <text x="20" y="65" font-family="JetBrains Mono, monospace" font-size="13" fill="#E4E9F2"><tspan dx="118">whoami</tspan></text>
    <text x="20" y="90" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#8794A8">Software Engineer Intern @ Visa</text>
